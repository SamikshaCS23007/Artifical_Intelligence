<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body{
    background:#f0f2f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}

.box{
    background:white;
    padding:30px;
    border-radius:10px;
    width:300px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    width:100%;
    padding:10px;
    background:#1877f2;
    color:white;
    border:none;
}
</style>
</head>

<body>

<div class="box">
<h2>Disease Prediction Login</h2>

<form action="/dashboard">
<input type="text" placeholder="Username" required>
<input type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

</div>

</body>
</html>
