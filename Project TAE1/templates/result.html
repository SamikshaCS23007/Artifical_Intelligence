<!DOCTYPE html>
<html>
<head>
<title>Result</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family:Arial;
    background:#f4f4f4;
    text-align:center;
}

.box{
    background:white;
    padding:30px;
    margin:50px auto;
    width:420px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.btn{
    padding:10px 15px;
    margin:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.back{
    background:#1877f2;
    color:white;
}

.logout{
    background:red;
    color:white;
}
</style>
</head>

<body>

<div class="box">

<h2>🧾 Health Analysis Report</h2>

<h3>{{ final }}</h3>

<canvas id="chart"></canvas>

<div style="margin-top:20px;">
    <span style="background:red;color:white;padding:5px 10px;">Flu: {{ flu }}%</span>
    <span style="background:blue;color:white;padding:5px 10px;">Cold: {{ cold }}%</span>
    <span style="background:green;color:white;padding:5px 10px;">Allergy: {{ allergy }}%</span>
</div>

<br>

<a href="/dashboard">
<button class="btn back">Back</button>
</a>

<a href="/">
<button class="btn logout">Logout</button>
</a>

</div>

<script>
new Chart(document.getElementById("chart"), {
    type: 'bar',
    data: {
        labels: ["Flu", "Cold", "Allergy"],
        datasets: [{
            label: "Probability %",
            data: [{ flu }, { cold }, { allergy }],
            backgroundColor: ["red", "blue", "green"]
        }]
    }
});
</script>

</body>
</html>
